[project]
name = "cryptographic-inventory-pqc-risk-assessment"
version = "0.1.0"
description = "TLS cryptographic inventory scanner with PQC/HNDL risk scoring."
requires-python = ">=3.10"

dependencies = [
    "cryptography",
    "pyopenssl",
    "requests",
    "pydantic",
    "rich"
]

[tool.black]
line-length = 88

[tool.flake8]
max-line-length = 88
exclude = ["__pycache__", ".venv"]

[tool.mypy]
strict = true
