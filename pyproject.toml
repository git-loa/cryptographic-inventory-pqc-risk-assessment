[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptographic-inventory-pqc-risk-assessment"
version = "0.1.0"
description = "Cryptographic inventory, security assessment, and modernization framework."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Leonard Okyere Afeke" }
]

dependencies = [
    "cryptography",
    "pyOpenSSL",
    "requests",
    "idna>=3.10,<4",
    "pydantic",
    "rich",
    "jinja2",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "black",
    "mypy",
    "hypothesis",
    "pre-commit",
    "pylint>=4.1,<5",
]

[project.scripts]
pqc-assessment = "pqc_inventory.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pqc_inventory*"]

[tool.setuptools.package-data]
pqc_inventory = [
    "templates/reports/*.j2",
    "templates/reports/assets/*.css",
    "templates/config/*.yaml",
]

[tool.black]
line-length = 88

[tool.flake8]
max-line-length = 88
exclude = ["**pycache**", ".venv"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pylint.typecheck]
generated-members = [
    "__required_keys__",
    "__optional_keys__",
]

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.format]
max-line-length = 88
