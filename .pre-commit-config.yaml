repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v2.3.0
  #   hooks:
  #     - id: mypy

  - repo: local
    hooks:
      - id: pylint-src
        name: pylint (production)
        entry: python -m pylint
        language: system
        types: [python]
        files: ^src/
        require_serial: true
        args:
          - --reports=n

      - id: pylint-tests
        name: pylint (tests)
        entry: python -m pylint
        language: system
        types: [python]
        files: ^tests/
        require_serial: true
        args:
          - --reports=n
          - --disable=duplicate-code
